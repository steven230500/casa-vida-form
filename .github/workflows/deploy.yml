name: deploy
on:
  workflow_run:
    workflows: ["docker-publish"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: SSH into droplet and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail

            # Docker / Compose check
            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sh
            fi
            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            else
              sudo curl -L "https://github.com/docker/compose/releases/download/v2.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
              COMPOSE="docker-compose"
            fi

            # External network for central Caddy proxy
            docker network inspect infra_infra_network >/dev/null 2>&1 || docker network create infra_infra_network

            # Deployment app folder
            SERVER_PATH="${{ secrets.SERVER_PATH }}"
            mkdir -p "$SERVER_PATH"
            cd "$SERVER_PATH"

            # Pull config from repo directly (kept until after migrations run)
            rm -rf temp_repo
            git clone https://github.com/steven230500/casa-vida-form.git temp_repo
            cp temp_repo/docker-compose.prod.yml docker-compose.yml

            # casa-vida's compose project owns the Postgres container this app
            # now shares; Compose prefixes network names by project directory,
            # so the actual name is discovered here rather than hardcoded.
            INTERNAL_NET=$(docker network ls --filter name=casavida_internal --format '{{.Name}}' | head -1)

            # RESEND_API_KEY isn't a GitHub secret for this repo - it's shared
            # with casa-vida's own Resend account and was seeded directly into
            # this droplet's .env by hand. Carry it forward across deploys
            # instead of wiping it, same as any other manually-set var.
            EXISTING_RESEND_KEY=$(grep -m1 '^RESEND_API_KEY=' .env 2>/dev/null || true)

            # Runtime secrets - written as a single printf, not a heredoc.
            # appleboy/ssh-action wraps every line of this script with its own
            # exit-code tracking (for script_stop), which corrupts multi-line
            # heredoc bodies by injecting garbage between each line.
            printf 'DATABASE_URL=postgres://casavida:%s@casavida-db:5432/casavida\nSESSION_SECRET=%s\nCASAVIDA_INTERNAL_NETWORK=%s\n' "${{ secrets.POSTGRES_PASSWORD }}" "${{ secrets.SESSION_SECRET }}" "$INTERNAL_NET" > .env
            if [ -n "$EXISTING_RESEND_KEY" ]; then
              echo "$EXISTING_RESEND_KEY" >> .env
            fi

            # Pull & Up
            $COMPOSE pull
            $COMPOSE up -d --remove-orphans

            # Apply pending SQL migrations against the shared casavida-db using
            # a throwaway node container on the same internal network -
            # drizzle-kit isn't bundled in the standalone production image, so
            # this runs from a full checkout instead.
            docker run --rm \
              --network "$INTERNAL_NET" \
              -v "$(pwd)/temp_repo:/app" -w /app \
              -e DATABASE_URL="postgres://casavida:${{ secrets.POSTGRES_PASSWORD }}@casavida-db:5432/casavida" \
              node:20-alpine sh -c "npm ci && npx drizzle-kit migrate"

            rm -rf temp_repo

            echo "Deployment to $SERVER_PATH completed successfully"
