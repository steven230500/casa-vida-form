<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <style>
    .dark-variant { display: none; }
    @media (prefers-color-scheme: dark) {
      .light-variant { display: none; }
      .dark-variant { display: inline; }
    }
  </style>
  <image class="light-variant" href="data:image/png;base64," width="128" height="128" />
  <image class="dark-variant" href="data:image/png;base64," width="128" height="128" />
</svg>
